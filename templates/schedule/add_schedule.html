{% load static %}
<div class="schedule-wrapper">
    <div class="modal_closer" style="position: absolute; display: flex; top: 1rem; left: 0; right: 1rem; bottom: 0; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; align-items: flex-start; z-index: 0;">
        <button type="button" class="btn bg-danger text-white closerBtn" data-bs-dismiss="modal" style="display: flex; width: 2rem; height: 2rem; border: 2px solid #fff; border-radius: 50%; flex-direction: row; flex-wrap: wrap; align-content: center; justify-content: center; align-items: center;">
            X
        </button>
    </div>

    <!-- DATE RANGE SECTION -->
    <div class="card-section">
        <div class="section-title">Date Range</div>

        <div class="form-row">
            <div class="form-group">
                <label>From Date</label>
                <input type="text" class="form-control datepicker" id="fromDate">
            </div>

            <div class="form-group">
                <label>To Date</label>
                <input type="text" class="form-control datepicker" id="toDate">
            </div>
        </div>
    </div>

    <!-- SLOT SECTION -->
    <div class="card-section">
        <div class="section-title">Slot Details</div>

        <div class="form-row">
            <div class="form-group">
                <label>Slot</label>
                <select id="slotTitle" class="form-control">
                    <option value="" selected disabled>Select Slot</option>
                    {% for slot in slot_details %}
                    <option value="{{ slot.slot_id }}">{{ slot.slot_name }} - {{ slot.from_time }} to {{ slot.to_time }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <!-- WEEKEND SECTION -->
    <!-- <div class="card-section">
        <div class="section-title">Slot Details</div>

        <div class="form-row">
            <div class="form-group">
                <label>Slot</label>
                <select id="slotTitle" class="form-control">
                    <option value="" selected disabled>Select Slot</option>
                    {% for slot in slot_details %}
                    <option value="{{ slot.slot_id }}">{{ slot.slot_name }} - {{ slot.from_time }} to {{ slot.to_time }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div> -->

    <div class="submissionBtn" style="display: flex; flex-direction: row; flex-wrap: wrap; align-content: center; justify-content: flex-end; align-items: center;">
        <button type="submit" class="btn-primary" id="saveScheduleBtn" style="z-index: 10;">
            Add Schedule
        </button>
    </div>

</div>

<script>
    $(document).ready(function () {

        $('#saveScheduleBtn').click(function (e) {
            e.preventDefault();

            const slot_id = $('#slotTitle').val();
            const from_date = $('#fromDate').val();
            const to_date = $('#toDate').val();

            if (!slot_id || !from_date || !to_date) {
                toastr.error("Please fill all fields.");
                return;
            }

            $.ajax({
                url: "{% url 'add_schedule' %}",
                type: "POST",
                headers: { 'X-CSRFToken': '{{ csrf_token }}' },
                contentType: "application/json",
                data: JSON.stringify({
                    slot_id: slot_id,
                    from_date: from_date,
                    to_date: to_date
                }),
                success: function (response) {

                    if (response.success) {

                        toastr.success(response.message);

                        // Reset form
                        $('#slotTitle').val('');
                        $('#fromDate').val('');
                        $('#toDate').val('');

                        // ✅ Only reload if success = true
                        setTimeout(function () {
                            location.reload();
                        }, 1000);

                    } else {

                        // ❌ No reload if duplicate / error
                        toastr.error(response.message);

                    }
                },
                error: function () {
                    toastr.error("An error occurred. Please try again.");
                }
            });
        });

    });
    //////////////////////////////////////////////////////
    $(function() {
        // From Date
        $("#fromDate").datepicker({
            dateFormat: "dd-mm-yy",
            changeMonth: true,
            changeYear: true,
            minDate: 0,
            onSelect: function(selectedDate) {
                var minToDate = $(this).datepicker('getDate');
                $("#toDate").datepicker("option", "minDate", minToDate);
            }
        }).datepicker("setDate", new Date()); // আজকের তারিখ দেখাবে

        // To Date
        $("#toDate").datepicker({
            dateFormat: "dd-mm-yy",
            changeMonth: true,
            changeYear: true,
            minDate: 0
        }).datepicker("setDate", new Date()); // আজকের তারিখ দেখাবে
    });
</script>
