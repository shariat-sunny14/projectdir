<script>
    const packageRadio = document.getElementById("id_is_package_price");
    const offerRadio = document.getElementById("id_is_offer_price");

    function selectPackage() {
        packageRadio.checked = true;
        offerRadio.checked = false;

        packageRadio.setAttribute("checked", "checked");
        offerRadio.removeAttribute("checked");
    }

    function selectOffer() {
        offerRadio.checked = true;
        packageRadio.checked = false;

        offerRadio.setAttribute("checked", "checked");
        packageRadio.removeAttribute("checked");
    }

    packageRadio.addEventListener("click", selectPackage);
    offerRadio.addEventListener("click", selectOffer);
    ///////////////////////////////////////////////
    document.addEventListener("click", function(e){

        if(e.target && e.target.id === "addElementsBtn"){

            e.preventDefault();

            const tbody = document.getElementById("PACKAGESTBODY");
            const selectElement = document.getElementById("id_package_elements");
            const serialNoInput = document.getElementById("id_package_Order_no");
            const descriptionInput = document.getElementById("id_elements_drescription");

            if(!tbody || !selectElement){
                console.log("Element missing!");
                return;
            }

            const elementId = selectElement.value;
            const elementText = selectElement.options[selectElement.selectedIndex]?.text;
            const serialNo = serialNoInput.value.trim();
            const description = descriptionInput.value.trim();

            if (!elementId || !serialNo || !description) {
                alert("All fields required!");
                return;
            }

            const rowCount = tbody.rows.length + 1;

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${rowCount}</td>
                <td>
                    ${elementText}
                    <input type="hidden" name="package_elements_list[]" value="${elementId}">
                </td>
                <td>${serialNo}
                    <input type="hidden" name="package_order_no_list[]" value="${serialNo}">
                </td>
                <td style="text-align: left; padding-left: 1rem;">
                    ${description}
                    <input type="hidden" name="elements_drescription_list[]" value="${description}">
                </td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm deleteRow">
                        <i class='bx bx-trash-alt'></i>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);

            selectElement.selectedIndex = 0;
            serialNoInput.value = "";
            descriptionInput.value = "";
        }

        // Delete
        if(e.target && e.target.classList.contains("deleteRow")){
            const row = e.target.closest("tr");
            row.remove();

            const tbody = document.getElementById("PACKAGESTBODY");
            const rows = tbody.querySelectorAll("tr");

            rows.forEach((row, index) => {
                row.cells[0].innerText = index + 1;
            });
        }

    });
    /////////////////////////////////////////////////////////////////
    $(function () {
        $("#addPackageForm").on("submit", function (e) {
        e.preventDefault();

        let formData = new FormData(this);

        $.ajax({
            url: "{% url 'add_package_setup_api' %}",
            type: "POST",
            data: formData,
            contentType: false,
            processData: false,
            dataType: "json",
            success: function (resp) {
            if (resp.success) {
                toastr.success(resp.msg);
                setTimeout(() => location.reload(), 300);
            } else {
                toastr.error(resp.errmsg);
            }
            },
            error: function (xhr) {
            console.error(xhr.responseText);
            toastr.error("An error occurred while processing the request.");
            },
        });
        });
    });
</script>
