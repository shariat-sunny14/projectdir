<script>
    $(document).ready(function () {
        loadOrganization();
    });

    function loadOrganization() {
        $.ajax({
            url: "{% url 'get_org_info_data' %}",
            method: "GET",
            success: function (resp) {
                if (resp.success) {

                    let data = resp.data;

                    $("#id_org_no").val(data.org_no);
                    $("#id_org_name").val(data.org_name);
                    $("#id_email").val(data.email);
                    $("#id_fax").val(data.fax);
                    $("#id_website").val(data.website);
                    $("#id_hotline").val(data.hotline);
                    $("#id_fb_link").val(data.fb_link);
                    $("#id_twitter_link").val(data.twitter_link);
                    $("#id_linkedin_link").val(data.linkedin_link);
                    $("#id_instagram_link").val(data.instagram_link);
                    $("#id_phone").val(data.phone);
                    $("#id_address").val(data.address);
                    $("#id_description").val(data.description);

                    // Checkbox
                    $("#id_is_active").prop("checked", data.is_active);

                    // Hidden org_id (important for update)
                    if ($("#id_org_id").length === 0) {
                        $("#org_form").append(
                            `<input type="hidden" id="id_org_id" name="org_id" value="${data.org_id}">`
                        );
                    } else {
                        $("#id_org_id").val(data.org_id);
                    }

                    // Logo Preview
                    if (data.org_logo) {
                        $("#selected_logo").attr("src", data.org_logo);
                    }

                } else {
                    toastr.error(resp.errmsg);
                }
            }
        });
    }

    //////////////////////////////////////////////////////////
    // image load in the page
    function displaySelectedLogo(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
    
            reader.onload = function (e) {
                var img = new Image();
                img.src = e.target.result;
    
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
    
                    var maxWidth = 300;
                    var maxHeight = 300;
    
                    var width = img.width;
                    var height = img.height;
    
                    if (width > maxWidth || height > maxHeight) {
                        if (width > height) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        } else {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
    
                        canvas.width = width;
                        canvas.height = height;
    
                        ctx.drawImage(img, 0, 0, width, height);
    
                        // Create or select the element with ID 'selected_logo'
                        var selectedLogo = document.getElementById('selected_logo');
                        if (!selectedLogo) {
                            selectedLogo = new Image();
                            selectedLogo.id = 'selected_logo';
                            document.body.appendChild(selectedLogo); // Append the image to the body or any other appropriate container
                        }
    
                        // Set the image source to the resized image
                        selectedLogo.src = canvas.toDataURL('image/jpeg');
    
                        // Check if image size exceeds 300x300 after resizing
                        if (width > maxWidth || height > maxHeight) {
                            toastr.warning('Image size should be within 300x300 pixels.');
                        }
                    } else {
                        // If the image is within the size limit, set the image source directly
                        var selectedLogo = document.getElementById('selected_logo');
                        if (selectedLogo) {
                            selectedLogo.src = img.src;
                        }
                    }
                };
            };
    
            reader.readAsDataURL(input.files[0]);
        }
    }

    // form submit with ajax
    $(function () {
        $('#org_form').submit(function (e) {
            e.preventDefault();
            var formData = new FormData($(this)[0]);

            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'org_add_update' %}",
                data: formData,
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                success: function (resp) {
                    if (success = resp.msg) {
                        toastr.success(resp.msg);
                        location.reload();
                    } else {
                        toastr.error(resp.errmsg);
                    }
                }
            });
        });
    });
</script>
