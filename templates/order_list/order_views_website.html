{% extends 'websites/base.html' %}
{% load crispy_forms_tags %}
{% load static %}
<!--========== CONTENTS start==========-->
{% block body %}

<!--- HEADER -->
<header style="border-bottom: 1px solid var(--cultured)">
  <!-- SUB-HEADER -->
  <!--- HEADER -->
  {% include 'websites/sub_header.html' %}
  <!--- HEADER -->
</header>

<!--- MAIN -->
<main class="container-fluid py-3" style="margin-top: 6rem;">

    <style>

        .inquire-card{
            /* border-radius:12px; */
            background: #4b4b4b;
            box-shadow:0 4px 20px rgba(0,0,0,0.08);
            border:none;
        }

        .inquires_headers{
            background:linear-gradient(135deg,#505050,#7a7a7a);
            color:#c3c3c3;
            padding:15px 20px;
            /* border-radius:12px 12px 0 0; */
        }

        .inquires_headers h4{
            margin:0;
            font-weight:600;
        }

        .filter-section{
            background:#7a7a7a;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
        }

        .filter-section label{
            font-weight:500;
            font-size:14px;
        }

        .filter-section input{
            border-radius:8px;
        }

        #orderList{
            overflow:hidden;
        }

        #orderList thead{
            background:#535353d8;
            color:#c3c3c3;
        }

        #orderList thead th{
            font-size:14px;
            font-weight:600;
            text-align:center;
        }

        #orderList tbody td{
            text-align:center;
            vertical-align:middle;
        }

        #orderList tbody tr:hover{
            background:#727272;
            transition:0.2s;
        }

        .option-btn{
            border:none;
            padding:6px 12px;
            border-radius:6px;
            font-size:13px;
        }

        .view-btn{
            color:#c3c3c3;
        }

        .delete-btn{
            background:#dc3545;
            color:#c3c3c3;
        }

        .dataTables_wrapper {
            font-size: 0.9rem;
        }

        .dataTables_length label{
            margin-left: 1rem;
        }

        .dataTables_filter label{
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            margin-right: 1rem;
        }

        .tbody-color {
            color: #c3c3c3;
        }

        .form-control {
            color: #c3c3c3;
            background-color: #8f8f8f;
            border: 1px solid #939393;
        }

        .dataTables_wrapper .dataTables_length select {
            border: 1px solid #939393;
            background-color: #8f8f8f;
        }

        .modal-content {
            background: transparent;
        }

    </style>


    <div class="card inquire-card">

        <!-- Header -->
        <div class="inquires_headers d-flex align-items-center">
            <i class='bx bxs-calendar mr-2' style="font-size: 22px;"></i>
            <h4>Order List</h4>
        </div>


        <div class="card-body">

            <!-- Filter Section -->
            <div class="filter-section row">

                <div class="col-md-4 d-flex align-items-center">
                    <label class="mr-2" style="width: 25%;">From Date</label>
                    <input type="text" class="form-control datepicker" id="from_date">
                </div>

                <div class="col-md-4 d-flex align-items-center">
                    <label class="mr-2" style="width: 25%;">To Date</label>
                    <input type="text" class="form-control datepicker" id="to_date">
                </div>

            </div>


            <!-- Table -->
            <div class="table-responsive">

                <table id="orderList" class="table table-striped table-hover">

                    <thead style="background: #707070;">
                        <tr>
                            <th style="text-align: center; width: 10%;">SL</th>
                            <th style="text-align: center;">Order Date</th>
                            <th style="text-align: center;">Full Name</th>
                            <th style="text-align: center;">Email</th>
                            <th style="text-align: center;">Phone</th>
                            <th style="text-align: center;">Schedule Name</th>
                            <th style="text-align: center;">Package Name</th>
                            <th style="text-align: center; width: 10%;">Options</th>
                        </tr>
                    </thead>

                    <tbody class="packagecategory-row">

                        <!-- Dynamic Data -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>
<script>
    // order list
    $(document).ready(function () {

        // ------------------------------
        // Helper: Get Today in dd-mm-yyyy
        // ------------------------------
        function getTodayDate() {
            const today = new Date();
            const day = ("0" + today.getDate()).slice(-2);
            const month = ("0" + (today.getMonth() + 1)).slice(-2);
            const year = today.getFullYear();
            return `${day}-${month}-${year}`;
        }

        // ------------------------------
        // Helper: Parse/Enforce dd-mm-yyyy
        // ------------------------------
        function parseDateInput(dateStr) {
            if (!dateStr) return getTodayDate();
            const parts = dateStr.split(/[-\/]/);
            if (parts.length !== 3) return getTodayDate();

            let day, month, year;

            if (parseInt(parts[0], 10) > 31) {
                // yyyy-mm-dd
                year = parts[0]; month = parts[1]; day = parts[2];
            } else {
                // dd-mm-yyyy
                day = parts[0]; month = parts[1]; year = parts[2];
            }
            return `${("0" + day).slice(-2)}-${("0" + month).slice(-2)}-${year}`;
        }

        // ------------------------------
        // Initialize jQuery UI Datepickers
        // ------------------------------
        const today = new Date();

        $("#from_date").datepicker({
            dateFormat: "dd-mm-yy",
            changeMonth: true,
            changeYear: true,
            minDate: null,
            onSelect: function(selectedDate) {
                const minToDate = $(this).datepicker('getDate');
                $("#to_date").datepicker("option", "minDate", minToDate);

                // Reload table whenever date changes
                table.ajax.reload(null, false);
            }
        }).datepicker("setDate", today);

        $("#to_date").datepicker({
            dateFormat: "dd-mm-yy",
            changeMonth: true,
            changeYear: true,
            minDate: null,
            onSelect: function(selectedDate) {
                table.ajax.reload(null, false);
            }
        }).datepicker("setDate", today);

        // ------------------------------
        // Initialize DataTable
        // ------------------------------
        var table = $('#orderList').DataTable({

            ordering: true,
            processing: true,
            serverSide: false,

            ajax: {
                url: "{% url 'get_order_list_by_user' %}",
                data: function(d){
                    d.from_date = $('#from_date').val();
                    d.to_date = $('#to_date').val();
                }
            },

            columnDefs: [
                { targets: "_all", className: "text-center tbody-color align-middle" }
            ],

            columns: [
                { data: 'sl' },
                { data: 'order_date' },
                { data: 'full_name' },
                { data: 'email' },
                { data: 'phone' },
                { data: 'schedule_name' },
                { data: 'package_name' },
                {
                    data: 'order_id',
                    render: function(data){
                        return `
                        <button class="btn btn-sm view-btn" data-id="${data}" style="background: #686868;">
                            <i class="bx bx-show"></i>
                        </button>
                        `
                    }
                }
            ]

        });

        // ------------------------------
        // Reload table when date changes
        // ------------------------------
        $('#from_date, #to_date').on('change', function () {
            const formattedDate = parseDateInput($(this).val());
            $(this).val(formattedDate);
            table.ajax.reload(null, false);
        });

        // ------------------------------
        // Optional: restrict manual typing
        // ------------------------------
        $('.datepicker').on('keydown', function(e) {
            if (
                !((e.keyCode >= 48 && e.keyCode <= 57) ||  // numbers 0-9
                (e.keyCode >= 96 && e.keyCode <= 105) || // numpad
                e.keyCode === 8 || e.keyCode === 9 || e.keyCode === 37 || e.keyCode === 39 || e.keyCode === 189 || e.keyCode === 191)
            ) {
                e.preventDefault();
            }
        });

    });


    $(document).on('click', '.view-btn', function () {

        var orderId = $(this).data('id');

        modal_xl(
            "View Order",
            "{% url 'view_order_modal' %}?order_id=" + orderId
        );

    });
</script>
{% endblock %}
