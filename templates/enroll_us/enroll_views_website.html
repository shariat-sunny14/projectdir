{% extends 'websites/base.html' %}
{% load crispy_forms_tags %}
{% load static %}

{% block body %}

<header style="border-bottom: 1px solid var(--cultured)">
  {% include 'websites/sub_header.html' %}
</header>

<main class="container-fluid py-3" style="margin-top: 6rem;">

<style>

/* ===== CARD (OLD STYLE) ===== */
.inquire-card{
    background: #4b4b4b;
    box-shadow:0 4px 20px rgba(0,0,0,0.08);
    border:none;
}

/* ===== HEADER ===== */
.inquires_headers{
    background:linear-gradient(135deg,#505050,#7a7a7a);
    color:#c3c3c3;
    padding:15px 20px;
}

.inquires_headers h4{
    margin:0;
    font-weight:600;
}

/* ===== FILTER ===== */
.filter-section{
    background:#7a7a7a;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.filter-section label{
    font-weight:500;
    font-size:14px;
    color:#fff;
}

.filter-section input{
    border-radius:8px;
}

/* ===== TABLE ===== */
#enrollList{
    overflow:hidden;
}

#enrollList thead{
    background:#535353d8;
    color:#c3c3c3;
}

#enrollList thead th{
    font-size:14px;
    font-weight:600;
    text-align:center;
}

#enrollList tbody td{
    text-align:center;
    vertical-align:middle;
    color:#c3c3c3;
}

#enrollList tbody tr:hover{
    background:#727272;
    transition:0.2s;
}

/* ===== BUTTON ===== */
.view-btn{
    background:#686868;
    color:#c3c3c3;
    border:none;
    padding:6px 10px;
    border-radius:6px;
}

/* ===== DATATABLE ===== */
.dataTables_wrapper {
    font-size: 0.9rem;
}

.dataTables_length label{
    margin-left: 1rem;
}

.dataTables_filter label{
    display: flex;
    align-items: center;
    margin-right: 1rem;
}

.form-control {
    color: #c3c3c3;
    background-color: #8f8f8f;
    border: 1px solid #939393;
}

.dataTables_wrapper .dataTables_length select {
    border: 1px solid #939393;
    background-color: #8f8f8f;
}

.modal-content {
    background: transparent;
}

</style>

<div class="card inquire-card">

    <!-- Header -->
    <div class="inquires_headers d-flex align-items-center">
        <i class='bx bxs-calendar mr-2' style="font-size: 22px;"></i>
        <h4>Enrollment Booking List</h4>
    </div>

    <div class="card-body">

        <!-- Filter -->
        <div class="filter-section row">

            <div class="col-md-4 d-flex align-items-center">
                <label class="mr-2" style="width: 25%;">From Date</label>
                <input type="text" class="form-control datepicker" id="from_date">
            </div>

            <div class="col-md-4 d-flex align-items-center">
                <label class="mr-2" style="width: 25%;">To Date</label>
                <input type="text" class="form-control datepicker" id="to_date">
            </div>

        </div>

        <!-- Table -->
        <div class="table-responsive">

            <table id="enrollList" class="table table-striped table-hover">

                <thead>
                    <tr>
                        <th style="width: 10%;">SL</th>
                        <th>Booking Date</th>
                        <th>Student Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Course Name</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody></tbody>

            </table>

        </div>

    </div>
</div>

</main>

<script>
$(document).ready(function () {

    function getTodayDate() {
        const today = new Date();
        const day = ("0" + today.getDate()).slice(-2);
        const month = ("0" + (today.getMonth() + 1)).slice(-2);
        const year = today.getFullYear();
        return `${day}-${month}-${year}`;
    }

    function parseDateInput(dateStr) {
        if (!dateStr) return getTodayDate();
        const parts = dateStr.split(/[-\/]/);
        if (parts.length !== 3) return getTodayDate();

        let day, month, year;

        if (parseInt(parts[0], 10) > 31) {
            year = parts[0]; month = parts[1]; day = parts[2];
        } else {
            day = parts[0]; month = parts[1]; year = parts[2];
        }
        return `${("0" + day).slice(-2)}-${("0" + month).slice(-2)}-${year}`;
    }

    const today = new Date();

    $("#from_date").datepicker({
        dateFormat: "dd-mm-yy",
        changeMonth: true,
        changeYear: true,
        onSelect: function() {
            table.ajax.reload(null, false);
        }
    }).datepicker("setDate", today);

    $("#to_date").datepicker({
        dateFormat: "dd-mm-yy",
        changeMonth: true,
        changeYear: true,
        onSelect: function() {
            table.ajax.reload(null, false);
        }
    }).datepicker("setDate", today);

    var table = $('#enrollList').DataTable({

        ordering: true,
        processing: true,
        serverSide: false,

        ajax: {
            url: "{% url 'get_enroll_booking_list' %}",
            data: function(d){
                d.from_date = $('#from_date').val();
                d.to_date = $('#to_date').val();
            }
        },

        columnDefs: [
            { targets: "_all", className: "text-center align-middle" }
        ],

        columns: [
            { data: 'sl' },
            { data: 'order_date' },
            { data: 'full_name' },
            { data: 'email' },
            { data: 'phone' },
            { data: 'course_name' },
            { data: 'course_amt' },
        ]

    });

    $('#from_date, #to_date').on('change', function () {
        const formattedDate = parseDateInput($(this).val());
        $(this).val(formattedDate);
        table.ajax.reload(null, false);
    });

});

$(document).on('click', '.view-btn', function () {
    var orderId = $(this).data('id');

    modal_xl(
        "Booking Details",
        "{% url 'view_order_modal' %}?order_id=" + orderId
    );
});
</script>

{% endblock %}
