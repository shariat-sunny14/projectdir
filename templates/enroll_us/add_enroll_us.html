<script>
    ///////////////////////////////////////////////
    document.addEventListener("click", function (e) {

        // Add new row
        if (e.target && (e.target.id === "addEnrollBtn")) {

            const tbody = document.getElementById("ENROLLSTBODY");

            const orderNo = document.getElementById("id_enroll_Order_no").value.trim();
            const details = document.getElementById("id_enroll_dtls").value.trim();

            if (!orderNo || !details) {
                alert("All fields required!");
                return;
            }

            const rowCount = tbody.rows.length + 1;

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${rowCount}</td>

                <td>
                    ${orderNo}
                    <input type="hidden" name="enroll_order_no_list[]" value="${orderNo}">
                </td>

                <td>
                    ${details}
                    <input type="hidden" name="enroll_dtls_list[]" value="${details}">
                </td>

                <td>
                    <input type="checkbox" name="is_published[]" value="${rowCount}">
                </td>

                <td>
                    <button type="button" class="btn btn-danger btn-sm deleteRow">
                        <i class='bx bx-trash-alt'></i>
                    </button>
                </td>
            `;

            tbody.appendChild(tr);

            // Clear input fields
            document.getElementById("id_enroll_Order_no").value = "";
            document.getElementById("id_enroll_dtls").value = "";
        }

        // Delete row
        const deleteBtn = e.target.closest(".deleteRow");
        if (deleteBtn) {
            const row = deleteBtn.closest("tr");
            row.remove();

            // Re-number remaining rows
            const rows = document.querySelectorAll("#ENROLLSTBODY tr");
            rows.forEach((row, index) => {
                row.cells[0].innerText = index + 1;

                // Also update the checkbox value if needed
                const checkbox = row.querySelector('input[type="checkbox"]');
                if (checkbox) {
                    checkbox.value = index + 1;
                }
            });
        }

    });
    /////////////////////////////////////////////////////////////////
    $(function () {

        $("#addEnrollForm").on("submit", function (e) {

            e.preventDefault();

            let formData = new FormData(this);

            $.ajax({

                url: "{% url 'save_enroll_setup_api' %}",
                type: "POST",
                data: formData,
                contentType: false,
                processData: false,
                dataType: "json",

                success: function (resp) {

                    if (resp.success) {

                        toastr.success(resp.msg);
                        setTimeout(() => location.reload(), 500);

                    } else {

                        toastr.error(resp.errmsg);

                    }

                },

                error: function (xhr) {

                    console.log(xhr.responseText);
                    toastr.error("Server Error");

                }

            });

        });

    });
</script>
