{% extends 'base_form/main_base/main_base.html' %}
{% load static %}

{% block extra_link %}
<link rel="stylesheet" href="{% static 'how_it_works/css/how_it_works.css' %}">
{% endblock %}

{% block body %}
<div class="hiw-admin" style="max-width: 560px;">
    <div class="hiw-form-card">
        <h5>Edit Section Heading</h5>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Kicker</label>
                {{ form.kicker }}
            </div>
            <div class="mb-3">
                <label class="form-label">Heading</label>
                {{ form.heading }}
            </div>
            <div class="form-check mb-3">
                {{ form.is_active }}
                <label class="form-check-label">Active</label>
            </div>
            <div class="hiw-form-actions">
                <a href="{% url 'how_it_works:how_it_workst' %}" class="btn btn-light">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
