{% extends 'websites/base.html' %}
{% load crispy_forms_tags %}
{% load static %}
<!--========== CONTENTS start==========-->
{% block body %}

<!--- HEADER -->
<header style="border-bottom: 1px solid #2a2a2a">
  <!-- SUB-HEADER -->
  <!--- HEADER -->
  {% include 'websites/sub_header.html' %}
  <!--- HEADER -->
</header>

<!--- MAIN -->
<main class="container-fluid py-3" style="margin-top: 6rem;">

    <style>

        /* ===== ROOT VARIABLES (Premium Black Theme) ===== */
        :root{
            --pb-bg:#0d0d0d;
            --pb-surface:#141414;
            --pb-surface-2:#1b1b1b;
            --pb-border:#2a2a2a;
            --pb-accent:#d4af37;      /* premium gold accent */
            --pb-accent-soft:rgba(212,175,55,0.12);
            --pb-danger:#ff5c5c;
            --pb-danger-soft:rgba(255,92,92,0.15);
            --pb-text:#e8e8e8;
            --pb-text-dim:#9a9a9a;
            --pb-radius:14px;
        }

        .inquire-card{
            background: var(--pb-surface);
            box-shadow: 0 10px 40px rgba(0,0,0,0.55);
            border: 1px solid var(--pb-border);
            border-radius: var(--pb-radius);
            overflow: hidden;
        }

        .inquires_headers{
            background: linear-gradient(135deg, #141414, #1e1e1e);
            color: var(--pb-text);
            padding: 18px 24px;
            border-bottom: 1px solid var(--pb-border);
            position: relative;
        }

        .inquires_headers::after{
            content:"";
            position:absolute;
            left:0; bottom:-1px;
            width:80px; height:2px;
            background: var(--pb-accent);
        }

        .inquires_headers h4{
            margin:0;
            font-weight:600;
            letter-spacing:0.3px;
        }

        .inquires_headers i{
            color: var(--pb-accent);
        }

        .filter-section{
            background: var(--pb-surface-2);
            padding: 18px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--pb-border);
        }

        .filter-section label{
            font-weight:500;
            font-size:14px;
            color: var(--pb-text-dim);
            letter-spacing:0.2px;
        }

        .filter-section input{
            border-radius:8px;
        }

        #inquireList{
            overflow:hidden;
            border-collapse: separate;
            border-spacing: 0;
        }

        #inquireList thead{
            background: var(--pb-surface-2) !important;
            color: var(--pb-accent);
        }

        #inquireList thead th{
            font-size:13px;
            font-weight:700;
            text-align:center;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--pb-border) !important;
            padding: 14px 10px;
        }

        #inquireList tbody td{
            text-align:center;
            vertical-align:middle;
            border-color: var(--pb-border) !important;
            padding: 12px 10px;
            background: var(--pb-surface);
        }

        #inquireList.table-striped tbody tr:nth-of-type(odd) td{
            background: var(--pb-surface-2);
        }

        #inquireList tbody tr:hover td{
            background: var(--pb-accent-soft) !important;
            transition:0.25s ease;
        }

        .option-btn{
            border:none;
            padding:6px 12px;
            border-radius:6px;
            font-size:13px;
            font-weight:600;
            transition: 0.2s ease;
        }

        .view-btn{
            background: var(--pb-accent) !important;
            color:#111 !important;
        }

        .view-btn:hover{
            background:#e8c458 !important;
            box-shadow: 0 4px 14px rgba(212,175,55,0.35);
        }

        .delete-btn{
            background: var(--pb-danger);
            color:#fff;
        }

        .delete-btn:hover{
            background:#ff7a7a;
            box-shadow: 0 4px 14px rgba(255,92,92,0.35);
        }

        .dataTables_wrapper {
            font-size: 0.9rem;
            color: var(--pb-text-dim);
        }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: var(--pb-text-dim) !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button{
            color: var(--pb-text-dim) !important;
            border-radius: 6px !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current{
            background: var(--pb-accent) !important;
            color:#111 !important;
            border-color: var(--pb-accent) !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover{
            background: var(--pb-accent-soft) !important;
            color: var(--pb-text) !important;
        }

        .dataTables_length label{
            margin-left: 1rem;
            color: var(--pb-text-dim);
        }

        .dataTables_filter label{
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            margin-right: 1rem;
            color: var(--pb-text-dim);
        }

        .tbody-color {
            color: var(--pb-text);
        }

        .form-control {
            color: var(--pb-text);
            background-color: var(--pb-surface-2);
            border: 1px solid var(--pb-border);
        }

        .form-control:focus{
            background-color: var(--pb-surface-2);
            color: var(--pb-text);
            border-color: var(--pb-accent);
            box-shadow: 0 0 0 0.15rem var(--pb-accent-soft);
        }

        .dataTables_wrapper .dataTables_length select {
            border: 1px solid var(--pb-border);
            background-color: var(--pb-surface-2);
            color: var(--pb-text);
        }

        .modal-content {
            background: transparent;
        }

        .inquire-card .card-body{
            background: var(--pb-bg);
        }

        /* ui-datepicker dark tweak (jQuery UI datepicker) */
        .ui-datepicker{
            background: var(--pb-surface) !important;
            border: 1px solid var(--pb-border) !important;
            color: var(--pb-text) !important;
        }
        .ui-datepicker .ui-datepicker-header{
            background: var(--pb-surface-2) !important;
            color: var(--pb-accent) !important;
            border: none !important;
        }
        .ui-datepicker td a{
            color: var(--pb-text) !important;
        }
        .ui-datepicker td a.ui-state-active{
            background: var(--pb-accent) !important;
            color: #111 !important;
        }

    </style>


    <div class="card inquire-card">

        <!-- Header -->
        <div class="inquires_headers d-flex align-items-center">
            <i class='bx bxs-calendar mr-2' style="font-size: 22px;"></i>
            <h4>Inquire List</h4>
        </div>


        <div class="card-body">

            <!-- Filter Section -->
            <div class="filter-section row">

                <div class="col-md-4 d-flex align-items-center">
                    <label class="mr-2" style="width: 25%;">From Date</label>
                    <input type="text" class="form-control datepicker" id="from_date">
                </div>

                <div class="col-md-4 d-flex align-items-center">
                    <label class="mr-2" style="width: 25%;">To Date</label>
                    <input type="text" class="form-control datepicker" id="to_date">
                </div>

            </div>


            <!-- Table -->
            <div class="table-responsive">

                <table id="inquireList" class="table table-striped table-hover">

                    <thead>
                        <tr>
                            <th width="10%">SL</th>
                            <th>Inquire Date</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th width="12%">Options</th>
                        </tr>
                    </thead>

                    <tbody class="packagecategory-row">

                        <!-- Dynamic Data -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>
<script>
    // order list
    $(document).ready(function () {

        // ------------------------------
        // Helper: get today in dd-mm-yyyy
        // ------------------------------
        function getTodayDate() {
            const today = new Date();
            const day = ("0" + today.getDate()).slice(-2);
            const month = ("0" + (today.getMonth() + 1)).slice(-2);
            const year = today.getFullYear();
            return `${day}-${month}-${year}`;
        }

        // ------------------------------
        // Helper: enforce dd-mm-yyyy format
        // ------------------------------
        function parseDateInput(dateStr) {
            if (!dateStr) return getTodayDate();
            const parts = dateStr.split(/[-\/]/);
            if (parts.length !== 3) return getTodayDate();

            let day, month, year;

            if (parseInt(parts[0], 10) > 31) {
                // yyyy-mm-dd
                year = parts[0]; month = parts[1]; day = parts[2];
            } else {
                // dd-mm-yyyy
                day = parts[0]; month = parts[1]; year = parts[2];
            }
            return `${("0" + day).slice(-2)}-${("0" + month).slice(-2)}-${year}`;
        }

        // ------------------------------
        // Initialize Datepickers
        // ------------------------------
        const today = new Date();
        $("#from_date").datepicker({
            dateFormat: "dd-mm-yy",
            changeMonth: true,
            changeYear: true,
            onSelect: function () {
                const minToDate = $(this).datepicker('getDate');
                $("#to_date").datepicker("option", "minDate", minToDate);
                table.ajax.reload(null, false);
            }
        }).datepicker("setDate", today);

        $("#to_date").datepicker({
            dateFormat: "dd-mm-yy",
            changeMonth: true,
            changeYear: true,
            onSelect: function () {
                table.ajax.reload(null, false);
            }
        }).datepicker("setDate", today);

        // ------------------------------
        // Initialize DataTable
        // ------------------------------
        var table = $('#inquireList').DataTable({
            ordering: true,
            processing: true,
            serverSide: false,
            ajax: {
                url: "{% url 'get_inquire_list' %}",
                data: function(d){
                    d.from_date = $('#from_date').val();
                    d.to_date = $('#to_date').val();
                }
            },

            columnDefs: [
                { targets: "_all", className: "text-center tbody-color align-middle" }
            ],

            columns: [
                { data: 'sl', className: "text-center" },
                { data: 'inquire_date', className: "text-center" },
                { data: 'full_name', className: "text-center" },
                { data: 'email', className: "text-center" },
                { data: 'phone', className: "text-center" },
                {
                    data: 'inquire_id',
                    className: "text-center",
                    render: function(data){
                        return `<button class="btn btn-sm option-btn view-btn" data-id="${data}">
                                    <i class="bx bx-show"></i>
                                </button>`;
                    }
                }
            ]
        });

        // ------------------------------
        // Restrict manual typing in date fields
        // ------------------------------
        $('.datepicker').on('keydown', function(e) {
            if (!((e.keyCode >= 48 && e.keyCode <= 57) || 
                (e.keyCode >= 96 && e.keyCode <= 105) ||
                [8,9,37,39,189,191].includes(e.keyCode))) {
                e.preventDefault();
            }
        });

    });


    $(document).on('click', '.view-btn', function () {

        var inquireId = $(this).data('id');

        modal_xl(
            "View Inquire",
            "{% url 'view_inquire_modal' %}?inquire_id=" + inquireId
        );

    });
</script>
{% endblock %}
