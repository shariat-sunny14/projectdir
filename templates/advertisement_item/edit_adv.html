    .card {

    .drop_box {

        font-weight: 400;

    .chooseBtn {

<script>
    $(document).ready(function () {
        $('#id_title_name').on('keydown', function (e) {
            let maxLen = parseInt($(this).attr('maxlength'));
            let currentLen = $(this).val().length;
    
            // Allow special keys like Backspace, Delete, Arrow keys
            if (
                e.key.length === 1 && // only check printable characters
                currentLen >= maxLen
            ) {
                toastr.info("Maximum length is 30 characters for Title Name.");
            }
        });
    
        $('#id_banner_text').on('keydown', function (e) {
            let maxLen = parseInt($(this).attr('maxlength'));
            let currentLen = $(this).val().length;
    
            if (
                e.key.length === 1 &&
                currentLen >= maxLen
            ) {
                toastr.info("Maximum length is 100 characters for Banner Text.");
            }
        });
    });

    // image load in the page
    function displaySelectedImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
    
            reader.onload = function (e) {
                var img = new Image();
                img.src = e.target.result;
    
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
    
                    var maxWidth = 300;
                    var maxHeight = 300;
    
                    var width = img.width;
                    var height = img.height;
    
                    if (width > maxWidth || height > maxHeight) {
                        if (width > height) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        } else {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
    
                        canvas.width = width;
                        canvas.height = height;
    
                        ctx.drawImage(img, 0, 0, width, height);
    
                        // Create or select the element with ID 'selected_image'
                        var selectedImage = document.getElementById('selected_image');
                        if (!selectedImage) {
                            selectedImage = new Image();
                            selectedImage.id = 'selected_image';
                            document.body.appendChild(selectedImage); // Append the image to the body or any other appropriate container
                        }
    
                        // Set the image source to the resized image
                        selectedImage.src = canvas.toDataURL('image/jpeg');
    
                        // Check if image size exceeds 300x300 after resizing
                        if (width > maxWidth || height > maxHeight) {
                            toastr.warning('Image size should be within 300x300 pixels.');
                        }
                    } else {
                        // If the image is within the size limit, set the image source directly
                        var selectedImage = document.getElementById('selected_image');
                        if (selectedImage) {
                            selectedImage.src = img.src;
                        }
                    }
                };
            };
    
            reader.readAsDataURL(input.files[0]);
        }
    }

    // save user
    $(function () {
        $('#editbanner_form').submit(function (e) {
            e.preventDefault();
            var formData = new FormData($(this)[0]);
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'edit_save_advert_item' %}",
                data: formData,
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                dataType: 'json',
                success: function (resp) {
                    console.log(resp);
                    if (resp.success) {
                        toastr.success(resp.msg);
                        setTimeout(function () { location.reload() }, 300);
                    } else {
                        toastr.error(resp.errmsg);
                    }
                },
                error: function (xhr, status, error) {
                    console.error(xhr.responseText);
                    toastr.error("An error occurred while processing the request.");
                }
            });
        });
    });
</script>
