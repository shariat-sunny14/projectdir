{% extends 'base_form/main_base/main_base.html' %}
{% load static %}

{% block extra_link %}
<style>

/* ===== PAGE BACKGROUND ===== */
body {
    background: linear-gradient(135deg, #eef2f7, #dfe9f3);
}

/* ===== FORM CONTAINER ===== */
.form-wrapper {
    max-width: 600px;
    margin: 50px auto;
    padding: 30px;

    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);

    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.form-wrapper:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

/* ===== TITLE ===== */
.form-title {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 25px;
}

/* ===== FORM GROUP ===== */
.form-group {
    margin-bottom: 18px;
}

/* LABEL */
.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
}

/* INPUT + TEXTAREA */
.form-group input,
.form-group textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    transition: 0.3s;
    font-size: 14px;
}

/* FOCUS EFFECT */
.form-group input:focus,
.form-group textarea:focus {
    border-color: #4CAF50;
    box-shadow: 0 0 6px rgba(76,175,80,0.3);
}

/* TEXTAREA HEIGHT */
.form-group textarea {
    min-height: 120px;
}

/* ===== BUTTON AREA ===== */
.form-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

/* SAVE BUTTON */
.btn-save {
    background: linear-gradient(135deg, #4CAF50, #2ecc71);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

/* BACK BUTTON */
.btn-back {
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    background: #555;
    color: white;
    transition: 0.3s;
}

.btn-back:hover {
    background: #333;
}

/* ===== LIVE PREVIEW ===== */
.preview-box {
    margin-top: 25px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
}

.preview-box iframe {
    width: 100%;
    height: 250px;
    border: none;
}

.preview-title {
    font-weight: 600;
    margin-bottom: 8px;
}

</style>
{% endblock %}

{% block body %}

<div class="form-wrapper">

    <div class="form-title">🎬 Add / Edit Video</div>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Video Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label>Paste Full Iframe Code</label>
            {{ form.iframe_code }}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-save">💾 Save</button>
            <a href="{% url 'video_list' %}" class="btn-back">⬅ Back</a>
        </div>
    </form>

    <!-- 🔥 LIVE PREVIEW -->
    <div class="preview-box" id="previewBox" style="display:none;">
        <div class="preview-title">Live Preview</div>
        <div id="previewContent"></div>
    </div>

</div>

<script>
// 🔥 LIVE IFRAME PREVIEW
const textarea = document.querySelector("textarea");
const previewBox = document.getElementById("previewBox");
const previewContent = document.getElementById("previewContent");

textarea.addEventListener("input", function () {
    const value = textarea.value.trim();

    if (value.includes("<iframe")) {
        previewBox.style.display = "block";
        previewContent.innerHTML = value;
    } else {
        previewBox.style.display = "none";
    }
});
</script>

{% endblock %}
